<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ENG TRAINER — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0e0e10; --surface: #17171a; --border: #2a2a30; --border2: #363640;
    --text: #e8e6e0; --muted: #6e6c68; --warm: #d4a862; --rust: #c0614a;
    --sage: #5d8a60; --blue: #4a7fa5; --radius: 2px;
  }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; font-size: 0.9rem; }
  /* ── Login ── */
  #login-wall { position: fixed; inset: 0; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 999; gap: 1.5rem; }
  #login-wall.hidden { display: none; }
  .login-box { background: var(--surface); border: 1px solid var(--border); padding: 2.5rem; width: 340px; border-radius: var(--radius); }
  .login-title { font-family: 'Instrument Serif', serif; font-size: 1.6rem; margin-bottom: 0.25rem; }
  .login-sub   { font-size: 0.78rem; color: var(--muted); margin-bottom: 1.5rem; }
  .field label  { display: block; font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.4rem; }
  .field input  { width: 100%; background: var(--bg); border: 1px solid var(--border2); border-radius: var(--radius); color: var(--text); font-family: 'DM Mono', monospace; font-size: 0.9rem; padding: 0.6rem 0.75rem; outline: none; transition: border-color 0.15s; }
  .field input:focus { border-color: var(--warm); }
  .login-err { font-size: 0.78rem; color: var(--rust); margin-top: 0.5rem; min-height: 1rem; }
  /* ── Layout ── */
  #app { display: grid; grid-template-columns: 280px 1fr; min-height: 100vh; }
  aside { background: var(--surface); border-right: 1px solid var(--border); padding: 1.5rem 1.25rem; display: flex; flex-direction: column; gap: 1.5rem; }
  .sidebar-logo { font-family: 'Instrument Serif', serif; font-size: 1.3rem; padding-bottom: 1rem; border-bottom: 1px solid var(--border); }
  .sidebar-logo span { color: var(--warm); font-style: italic; }
  .sidebar-logo small { display: block; font-family: 'DM Sans', sans-serif; font-size: 0.68rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-top: 0.15rem; }
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }
  .stat-box { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 0.75rem; }
  .stat-box .n { font-family: 'Instrument Serif', serif; font-size: 1.6rem; line-height: 1; }
  .stat-box .l { font-size: 0.68rem; color: var(--muted); margin-top: 0.15rem; letter-spacing: 0.04em; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem; padding: 0.65rem 1.25rem; border: 1px solid var(--border2); border-radius: var(--radius); background: transparent; color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 0.85rem; font-weight: 500; cursor: pointer; transition: all 0.15s; width: 100%; }
  .btn:hover { background: var(--border); }
  .btn-primary { background: var(--warm); border-color: var(--warm); color: #1a1000; }
  .btn-primary:hover { background: #e0b96e; border-color: #e0b96e; }
  .btn-danger  { color: var(--rust); border-color: var(--rust); }
  .btn-danger:hover  { background: #c0614a18; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-sm { padding: 0.35rem 0.75rem; font-size: 0.78rem; width: auto; }
  /* ── Main ── */
  .main-col { display: flex; flex-direction: column; }
  .topbar { border-bottom: 1px solid var(--border); padding: 1rem 1.5rem; display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
  .topbar h2 { font-family: 'Instrument Serif', serif; font-size: 1.2rem; }
  .topbar-actions { display: flex; gap: 0.5rem; align-items: center; }
  .content { padding: 1.5rem; flex: 1; }
  /* ── Generate Panel ── */
  .gen-panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.25rem; margin-bottom: 1.5rem; }
  .gen-title { font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 1rem; }
  .gen-row { display: flex; gap: 0.75rem; align-items: flex-end; flex-wrap: wrap; }
  .gen-row .field { flex: 1; min-width: 180px; }
  .gen-row .field select { width: 100%; background: var(--bg); border: 1px solid var(--border2); border-radius: var(--radius); color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 0.88rem; padding: 0.6rem 0.75rem; outline: none; }
  .gen-row .field input { width: 100%; }
  .gen-status { margin-top: 0.75rem; font-size: 0.8rem; color: var(--muted); min-height: 1.2rem; font-family: 'DM Mono', monospace; }
  .gen-status.ok  { color: var(--sage); }
  .gen-status.err { color: var(--rust); }
  /* ── Lesson Table ── */
  .lesson-table { width: 100%; border-collapse: collapse; }
  .lesson-table th { text-align: left; font-size: 0.68rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); padding: 0.5rem 0.75rem; border-bottom: 1px solid var(--border); font-weight: 500; }
  .lesson-table td { padding: 0.75rem; border-bottom: 1px solid var(--border); vertical-align: middle; }
  .lesson-table tr:last-child td { border-bottom: none; }
  .lesson-table tr:hover td { background: var(--surface); }
  .topic-cell { font-family: 'Instrument Serif', serif; font-size: 1rem; }
  .id-cell   { font-family: 'DM Mono', monospace; font-size: 0.75rem; color: var(--muted); }
  .date-cell { font-size: 0.78rem; color: var(--muted); }
  .badge { display: inline-flex; align-items: center; padding: 0.2rem 0.55rem; border-radius: var(--radius); font-size: 0.68rem; font-weight: 600; letter-spacing: 0.06em; border: 1px solid; }
  .badge-b1 { border-color: var(--sage); color: var(--sage); }
  .badge-b2 { border-color: var(--rust); color: var(--rust); }
  /* ── Detail Drawer ── */
  #drawer { position: fixed; right: 0; top: 0; height: 100vh; width: 560px; background: var(--surface); border-left: 1px solid var(--border); transform: translateX(100%); transition: transform 0.3s cubic-bezier(0.4,0,0.2,1); overflow-y: auto; z-index: 200; }
  #drawer.open { transform: translateX(0); }
  .drawer-header { position: sticky; top: 0; background: var(--surface); border-bottom: 1px solid var(--border); padding: 1rem 1.25rem; display: flex; align-items: center; justify-content: space-between; }
  .drawer-close { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 1.2rem; padding: 0.25rem; }
  .drawer-body { padding: 1.25rem; }
  .d-section { margin-bottom: 1.5rem; }
  .d-label { font-size: 0.68rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.5rem; }
  .d-text { line-height: 1.7; font-size: 0.9rem; }
  .d-vocab { display: flex; flex-direction: column; gap: 0.5rem; }
  .d-vocab-item { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 0.6rem 0.8rem; }
  .d-vocab-word { font-family: 'Instrument Serif', serif; font-size: 1rem; }
  .d-vocab-meaning { font-size: 0.78rem; color: var(--warm); }
  .d-vocab-ex { font-size: 0.78rem; color: var(--muted); font-style: italic; }
  .d-q { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 0.75rem; margin-bottom: 0.5rem; }
  .d-q-text { font-size: 0.88rem; margin-bottom: 0.5rem; }
  .d-q-opts { display: flex; flex-direction: column; gap: 0.25rem; }
  .d-q-opt { font-size: 0.8rem; padding: 0.25rem 0.5rem; border-radius: 2px; display: flex; gap: 0.5rem; }
  .d-q-opt.correct { background: #5d8a601a; color: var(--sage); }
  .d-q-exp { font-size: 0.75rem; color: var(--muted); margin-top: 0.4rem; border-top: 1px solid var(--border); padding-top: 0.4rem; }
  /* ── Toast ── */
  #toast { position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%) translateY(80px); background: var(--text); color: var(--bg); padding: 0.6rem 1.25rem; border-radius: 20px; font-size: 0.85rem; font-weight: 500; transition: transform 0.3s ease; z-index: 500; white-space: nowrap; }
  #toast.show { transform: translateX(-50%) translateY(0); }
  .empty-state { text-align: center; padding: 4rem 2rem; color: var(--muted); }
  .empty-state p { font-family: 'Instrument Serif', serif; font-size: 1.1rem; }
  @media (max-width: 800px) { #app { grid-template-columns: 1fr; } aside { display: none; } #drawer { width: 100%; } }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-wall">
  <div class="login-box">
    <div class="login-title">Admin Panel</div>
    <div class="login-sub">ENG Trainer — จัดการคลังบทเรียน</div>
    <div class="field">
      <label>Admin Password</label>
      <input type="password" id="pw-input" placeholder="••••••••" autocomplete="current-password" />
      <div class="login-err" id="login-err"></div>
    </div>
    <button class="btn btn-primary" style="margin-top:1rem" onclick="doLogin()">เข้าสู่ระบบ</button>
  </div>
</div>

<!-- APP -->
<div id="app">
  <aside>
    <div>
      <div class="sidebar-logo">ENG <span>Trainer</span><small>Admin Panel</small></div>
    </div>
    <div class="stat-grid">
      <div class="stat-box"><div class="n" id="stat-total">—</div><div class="l">บทเรียนทั้งหมด</div></div>
      <div class="stat-box"><div class="n" id="stat-b1">—</div><div class="l">ระดับ B1</div></div>
      <div class="stat-box"><div class="n" id="stat-b2">—</div><div class="l">ระดับ B2</div></div>
      <div class="stat-box"><div class="n" id="stat-today">—</div><div class="l">วันนี้</div></div>
    </div>
    <button class="btn btn-danger btn-sm" style="width:auto;margin-top:auto" onclick="logout()">ออกจากระบบ</button>
  </aside>

  <div class="main-col">
    <div class="topbar">
      <h2>คลังบทเรียน</h2>
      <div class="topbar-actions">
        <button class="btn btn-sm" onclick="loadLessons()">↻ รีเฟรช</button>
      </div>
    </div>
    <div class="content">
      <!-- Generate -->
      <div class="gen-panel">
        <div class="gen-title">Generate บทเรียนใหม่</div>
        <div class="gen-row">
          <div class="field">
            <label>หัวข้อ (เว้นว่างเพื่อสุ่ม)</label>
            <input type="text" id="gen-topic" placeholder="เช่น Climate Change, Coffee, AI..." />
          </div>
          <div class="field" style="min-width:120px;flex:0">
            <label>Difficulty</label>
            <select id="gen-diff"><option value="B1">B1</option><option value="B2">B2</option></select>
          </div>
          <button class="btn btn-primary btn-sm" id="btn-gen" onclick="generateLesson()" style="width:auto;white-space:nowrap">⚡ Generate</button>
        </div>
        <div class="gen-status" id="gen-status"></div>
      </div>

      <!-- Table -->
      <div id="lesson-container">
        <div class="empty-state"><p>กำลังโหลด…</p></div>
      </div>
    </div>
  </div>
</div>

<!-- Drawer -->
<div id="drawer">
  <div class="drawer-header">
    <div style="font-family:'Instrument Serif',serif;font-size:1.1rem" id="drawer-title">รายละเอียด</div>
    <button class="drawer-close" onclick="closeDrawer()">✕</button>
  </div>
  <div class="drawer-body" id="drawer-body"></div>
</div>

<!-- Toast -->
<div id="toast"></div>

<script>
const WORKER_URL = "https://young-star-889a.kotchasee-n.workers.dev";
const PW_KEY = "eng_admin_pw";
let adminPw = "", lessons = [];

// ── Auth ──────────────────────────────────────────────────────
function doLogin() {
  const pw = document.getElementById("pw-input").value.trim();
  if (!pw) return;
  adminPw = pw;
  document.getElementById("login-wall").classList.add("hidden");
  loadLessons();
}
function logout() {
  adminPw = "";
  document.getElementById("login-wall").classList.remove("hidden");
  document.getElementById("pw-input").value = "";
}
document.getElementById("pw-input").addEventListener("keydown", e => { if (e.key==="Enter") doLogin(); });

// ── API ───────────────────────────────────────────────────────
async function api(path, method="GET", body=null) {
  const opts = { method, headers: { "Content-Type": "application/json", "X-Admin-Password": adminPw } };
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(WORKER_URL + path, opts);
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
  return data;
}

// ── Toast ─────────────────────────────────────────────────────
function toast(msg, dur=2800) {
  const el = document.getElementById("toast");
  el.textContent = msg; el.classList.add("show");
  setTimeout(() => el.classList.remove("show"), dur);
}

// ── Load ──────────────────────────────────────────────────────
async function loadLessons() {
  document.getElementById("lesson-container").innerHTML = `<div class="empty-state"><p>กำลังโหลด…</p></div>`;
  try {
    lessons = await api("/lessons");
    renderStats();
    renderTable();
  } catch(e) {
    if (e.message.includes("401")) {
      document.getElementById("login-err").textContent = "รหัสผ่านไม่ถูกต้อง";
      logout();
    } else {
      document.getElementById("lesson-container").innerHTML = `<div class="empty-state"><p style="color:#c0614a">⚠️ ${e.message}</p></div>`;
    }
  }
}

function renderStats() {
  const today = new Date().toDateString();
  document.getElementById("stat-total").textContent = lessons.length;
  document.getElementById("stat-b1").textContent = lessons.filter(l=>l.difficulty==="B1").length;
  document.getElementById("stat-b2").textContent = lessons.filter(l=>l.difficulty==="B2").length;
  document.getElementById("stat-today").textContent = lessons.filter(l => new Date(l.created_at).toDateString()===today).length;
}

function renderTable() {
  if (!lessons.length) {
    document.getElementById("lesson-container").innerHTML = `<div class="empty-state"><p>ยังไม่มีบทเรียน — กด Generate เพื่อสร้าง</p></div>`;
    return;
  }
  const sorted = [...lessons].sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
  document.getElementById("lesson-container").innerHTML = `
    <table class="lesson-table">
      <thead><tr>
        <th>ID</th><th>หัวข้อ</th><th>ระดับ</th><th>วันที่</th><th></th>
      </tr></thead>
      <tbody>
        ${sorted.map(l=>`
          <tr>
            <td class="id-cell">${l.id}</td>
            <td class="topic-cell" style="cursor:pointer" onclick="openDrawer('${l.id}')">${l.topic}</td>
            <td><span class="badge badge-${(l.difficulty||'b1').toLowerCase()}">${l.difficulty||'B1'}</span></td>
            <td class="date-cell">${new Date(l.created_at).toLocaleDateString("th-TH")}</td>
            <td style="display:flex;gap:0.5rem;justify-content:flex-end">
              <button class="btn btn-sm" onclick="openDrawer('${l.id}')">ดู</button>
              <button class="btn btn-sm btn-danger" onclick="deleteLesson('${l.id}')">ลบ</button>
            </td>
          </tr>`).join("")}
      </tbody>
    </table>`;
}

// ── Generate ──────────────────────────────────────────────────
async function generateLesson() {
  const btn = document.getElementById("btn-gen");
  const st  = document.getElementById("gen-status");
  const topic = document.getElementById("gen-topic").value.trim();
  const difficulty = document.getElementById("gen-diff").value;
  btn.disabled = true; btn.textContent = "กำลัง Generate…";
  st.className = "gen-status"; st.textContent = "⏳ เรียก Gemini API…";
  try {
    const res = await api("/generate","POST",{ topic, difficulty });
    st.className = "gen-status ok";
    st.textContent = `✓ สร้าง "${res.lesson.topic}" (${res.lesson.id}) สำเร็จ`;
    document.getElementById("gen-topic").value = "";
    toast("✅ บทเรียนใหม่พร้อมแล้ว!");
    await loadLessons();
  } catch(e) {
    st.className = "gen-status err";
    st.textContent = "✗ " + e.message;
  } finally {
    btn.disabled = false; btn.textContent = "⚡ Generate";
  }
}

// ── Delete ────────────────────────────────────────────────────
async function deleteLesson(id) {
  if (!confirm(`ลบบทเรียน "${id}" จริงไหม?`)) return;
  try {
    await api(`/lessons/${id}`, "DELETE");
    toast(`🗑️ ลบ ${id} แล้ว`);
    if (document.getElementById("drawer").classList.contains("open")) closeDrawer();
    await loadLessons();
  } catch(e) { alert("ลบไม่ได้: " + e.message); }
}

// ── Drawer ────────────────────────────────────────────────────
async function openDrawer(id) {
  document.getElementById("drawer-title").textContent = "กำลังโหลด…";
  document.getElementById("drawer-body").innerHTML = `<div style="text-align:center;padding:3rem;color:var(--muted)">⏳</div>`;
  document.getElementById("drawer").classList.add("open");
  try {
    const l = await api(`/lessons/${id}`);
    document.getElementById("drawer-title").textContent = l.topic;
    document.getElementById("drawer-body").innerHTML = `
      <div style="display:flex;gap:0.5rem;align-items:center;margin-bottom:1.25rem;flex-wrap:wrap">
        <span style="font-family:'DM Mono',monospace;font-size:0.75rem;color:var(--muted)">${l.id}</span>
        <span class="badge badge-${(l.difficulty||'b1').toLowerCase()}">${l.difficulty||'B1'}</span>
        <span style="font-size:0.75rem;color:var(--muted);margin-left:auto">${new Date(l.created_at).toLocaleString("th-TH")}</span>
      </div>
      <div class="d-section">
        <div class="d-label">Article</div>
        <div class="d-text">${l.article}</div>
      </div>
      <div class="d-section">
        <div class="d-label">Vocabulary (${(l.vocabulary||[]).length} คำ)</div>
        <div class="d-vocab">
          ${(l.vocabulary||[]).map(v=>`
            <div class="d-vocab-item">
              <div class="d-vocab-word">${v.word}</div>
              <div class="d-vocab-meaning">${v.meaning}</div>
              <div class="d-vocab-ex">"${v.example}"</div>
            </div>`).join("")}
        </div>
      </div>
      <div class="d-section">
        <div class="d-label">Questions (${(l.questions||[]).length} ข้อ)</div>
        ${(l.questions||[]).map((q,i)=>`
          <div class="d-q">
            <div class="d-q-text">${i+1}. ${q.question}</div>
            <div class="d-q-opts">
              ${["A","B","C","D"].map(k=>`
                <div class="d-q-opt ${k===q.answer?'correct':''}">
                  <strong>${k}.</strong> ${q.options[k]}
                </div>`).join("")}
            </div>
            <div class="d-q-exp">เฉลย: <strong>${q.answer}</strong> — ${q.explanation}</div>
          </div>`).join("")}
      </div>
      <button class="btn btn-danger" onclick="deleteLesson('${l.id}')">ลบบทเรียนนี้</button>
    `;
  } catch(e) {
    document.getElementById("drawer-body").innerHTML = `<p style="color:var(--rust);padding:1rem">⚠️ ${e.message}</p>`;
  }
}
function closeDrawer() { document.getElementById("drawer").classList.remove("open"); }
document.addEventListener("keydown", e => { if (e.key==="Escape") closeDrawer(); });
</script>
</body>
</html>
